---
# SonarMark Cli HelpCommand unit requirements
#
# The HelpCommand unit answers the 'sonarmark help' command from the help cards that are
# embedded in the tool assembly. It is the only unit that uses the HelpCards library.
sections:
  - title: SonarMark Requirements
    sections:
      - title: Cli Requirements
        sections:
          - title: HelpCommand Requirements
            requirements:
              - id: SonarMark-Cli-HelpCommand-HelpVerb
                title: >-
                  The HelpCommand unit shall answer the help verb from the help cards embedded in the
                  tool assembly.
                justification: |
                  A user or an AI agent that has only the installed tool must be able to learn it
                  from sonarmark help. The cards travel inside the assembly, so the help works
                  wherever the tool is installed.
                children:
                  - SonarMark-OTS-HelpCards-Cli
                tests:
                  - HelpCommand_TryRun_HelpVerb_PrintsTopicIndexAndReturnsZero

              - id: SonarMark-Cli-HelpCommand-ValidCards
                title: >-
                  The HelpCommand unit shall serve only help cards that pass validation with the
                  expected set of topics and purpose tags.
                justification: |
                  A defective card, a missing topic, or a card without a purpose would give users
                  wrong or hard-to-find guidance. Validating the shipped catalog, with warnings
                  treated as errors, keeps the help correct before release.
                children:
                  - SonarMark-OTS-HelpCards-Testing
                tests:
                  - HelpCommand_CreateOptions_ShippedCatalog_PassesValidation

              - id: SonarMark-Cli-HelpCommand-LineWidth
                title: The HelpCommand unit shall print every help card in lines of at most 120 characters.
                justification: |
                  Help is read in terminals and CI logs. Expanded links and tokens make printed lines
                  longer than the card source, so the printed width is what must stay readable.
                tests:
                  - HelpCommand_TryRun_EveryCard_FitsMaximumLineWidth
